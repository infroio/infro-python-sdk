[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infro"
version = "0.1.2"
description = "The official Python client for the INFRO API — one endpoint for text, image, video and audio models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "INFRO", email = "support@infro.io" }]
keywords = ["infro", "ai", "llm", "openai", "image-generation", "video-generation", "gateway"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# One dependency, on purpose. `httpx` is the only mainstream Python HTTP client
# that gives a synchronous and an asynchronous API over one implementation, and
# streaming a completion needs both to behave identically.
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://infro.io"
Documentation = "https://infro.io/docs"
Source = "https://github.com/infroio/infro-python-sdk"
Issues = "https://github.com/infroio/infro-python-sdk/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/infro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
